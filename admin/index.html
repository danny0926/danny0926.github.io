<!doctype html><html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drinks Admin / Danny</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../wafer-theme.css"><link rel="stylesheet" href="admin.css"></head><body><main><header><h1>DANNY / DRINKS ADMIN</h1><a href="../drinks.html">回到酒櫃 ↗</a></header><section id="login"><h2>連接 GitHub</h2><p>使用 danny0926 的 Fine-grained Token，只授權 danny0926.github.io 儲存庫的 Contents：Read and write。Token 僅保留在此分頁記憶體，重新整理即清除。</p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">建立 Token ↗</a><label>GitHub Token<input id="token" type="password" autocomplete="off"></label><button id="connect">連接帳號</button></section><section id="editor" hidden><div class="toolbar"><select id="collection" aria-label="選擇酒款"></select><button id="new">新增酒款</button><button id="logout">登出</button></div><p>先儲存到草稿，再發布整份酒櫃。草稿在記憶體中，離開前請匯出備份。</p><form id="form"><label>分類<select name="category"><option value="sake">清酒</option><option value="beer">啤酒</option><option value="whisky">威士忌</option><option value="baijiu">白酒</option><option value="awamori">燒酎・泡盛</option></select></label><label>名稱<input name="name" required maxlength="160"></label><label>介紹<input name="description" maxlength="500"></label><label>容量／酒精濃度<input name="spec" maxlength="100"></label><label>圖片網址或站內路徑<input name="image"></label><label>上傳圖片（JPEG／PNG／WebP，最大 5 MB）<input id="upload" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="preview" alt="酒款圖片預覽" hidden><label>圖片來源連結<input name="source" type="url"></label><label>我的品飲筆記<textarea name="notes" rows="6"></textarea></label><label class="check"><input id="enable-radar" type="checkbox">顯示我的品飲雷達圖</label><p>0：未感受到；5：非常明顯。餘韻以長度表示，分數不是品質評價。</p><div id="scores"></div><button type="submit">儲存到草稿</button></form><div class="toolbar"><button id="publish">發布整份酒櫃</button><button id="export">匯出草稿 JSON</button><button id="delete">刪除目前酒款</button></div></section><p id="status" role="status" aria-live="polite"></p></main><script src="../drinks-data.js"></script><script src="admin.js"></script></body></html>
