<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">GAT 與強化學習智慧排程研究</title><desc id="desc">輸入塔、搬運機器人、六台機台和輸出塔形成狀態圖；GAT 與 CNN 擷取特徵，D3QN 決定動作。相較規則式方法，六、十二、十八台機台的完成速度分別為 1.32、1.44、1.45 倍。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#71877e"/></marker><style>.bg{fill:#12191a}.panel{fill:#1c2627;stroke:#344746;stroke-width:1.5}.line{stroke:#50655f;stroke-width:2;fill:none}.wire{stroke:#4e7367;stroke-width:2;fill:none}.t{font-family:Arial,'Noto Sans TC',sans-serif;fill:#f4f4ee}.muted{fill:#a9b9b2}.mono{font-family:Consolas,monospace;fill:#8ee1c5;letter-spacing:2px}.node{stroke-width:2}.small{font-size:18px}.label{font-size:20px;font-weight:700}.big{font-size:30px;font-weight:700}</style></defs>
<rect class="bg" width="1200" height="760" rx="22"/><text class="mono" x="48" y="62" font-size="15">01 / FROM SHOP FLOOR STATE TO POLICY</text><text class="t big" x="48" y="108">把搬運與加工狀態，變成可學習的排程決策</text>
<rect class="panel" x="48" y="142" width="456" height="270" rx="14"/><text class="t label" x="72" y="180">產線狀態圖</text><text class="muted small" x="72" y="209">機台、物料塔與搬運機器人</text>
<path class="wire" d="M151 287 H253 M334 287 H404 M293 268 L381 232 M293 304 L381 342 M151 287 L100 350"/><circle class="node" cx="122" cy="287" r="31" fill="#e1b771" stroke="#f5d494"/><circle class="node" cx="293" cy="287" r="42" fill="#80d7b8" stroke="#aaebd3"/><circle class="node" cx="425" cy="287" r="31" fill="#718fe1" stroke="#a6b9f0"/><circle class="node" cx="100" cy="350" r="24" fill="#a07bc8" stroke="#c3a8dd"/><circle class="node" cx="393" cy="226" r="24" fill="#ed806f" stroke="#f2a89a"/><circle class="node" cx="393" cy="342" r="24" fill="#ed806f" stroke="#f2a89a"/><text class="t" x="122" y="294" text-anchor="middle" font-size="18">入</text><text x="293" y="295" text-anchor="middle" font-size="19" fill="#102b25" font-weight="bold">車</text><text class="t" x="425" y="294" text-anchor="middle" font-size="18">出</text><text class="t" x="393" y="233" text-anchor="middle" font-size="16">R</text><text class="t" x="393" y="349" text-anchor="middle" font-size="16">G</text>
<path class="line" d="M509 277 H553" marker-end="url(#arrow)"/><rect class="panel" x="558" y="142" width="594" height="270" rx="14"/><text class="t label" x="584" y="180">決策模型</text><text class="muted small" x="584" y="209">同時讀取目前與前一個狀態</text>
<rect x="585" y="252" width="110" height="72" rx="9" fill="#314d45" stroke="#81bca8"/><text class="t label" x="640" y="296" text-anchor="middle">GAT</text><path class="line" d="M701 288 H740" marker-end="url(#arrow)"/><rect x="745" y="252" width="110" height="72" rx="9" fill="#303d4d" stroke="#879fc3"/><text class="t label" x="800" y="296" text-anchor="middle">CNN</text><path class="line" d="M861 288 H900" marker-end="url(#arrow)"/><rect x="905" y="252" width="110" height="72" rx="9" fill="#493b46" stroke="#ca9ead"/><text class="t label" x="960" y="296" text-anchor="middle">D3QN</text><path class="line" d="M1021 288 H1060" marker-end="url(#arrow)"/><text class="t small" x="1072" y="280">下一步</text><text class="t small" x="1072" y="307">搬運動作</text><text class="muted" x="585" y="374" font-size="16">圖特徵 → 局部特徵 → 強化學習策略</text>
<line x1="48" y1="447" x2="1152" y2="447" stroke="#344746"/><text class="mono" x="48" y="491" font-size="15">02 / TESTED AGAINST RULE-BASED SCHEDULING</text><text class="t label" x="48" y="533">完成速度比較</text><text class="muted small" x="48" y="565">規則式方法 = 1.00×；數值越高，整體完成時間越短</text>
<line x1="445" y1="704" x2="1110" y2="704" stroke="#546761"/><line x1="445" y1="583" x2="445" y2="705" stroke="#546761"/><text class="muted" x="445" y="738" text-anchor="middle" font-size="15">1.00×</text><text class="muted" x="771" y="738" text-anchor="middle" font-size="15">1.25×</text><text class="muted" x="1095" y="738" text-anchor="middle" font-size="15">1.50×</text>
<text class="t small" x="383" y="615" text-anchor="end">6 台機台</text><rect x="445" y="596" width="416" height="22" rx="4" fill="#70c9a9"/><text class="t small" x="875" y="615">1.32×</text>
<text class="t small" x="383" y="653" text-anchor="end">12 台機台</text><rect x="445" y="634" width="572" height="22" rx="4" fill="#70c9a9"/><text class="t small" x="1031" y="653">1.44×</text>
<text class="t small" x="383" y="691" text-anchor="end">18 台機台</text><rect x="445" y="672" width="585" height="22" rx="4" fill="#70c9a9"/><text class="t small" x="1044" y="691">1.45×</text>
</svg>
