<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img"><title>企業 AI Agent 實作與上線成果</title><rect x="0" y="0" width="1200" height="760" rx="22" fill="#12191a" stroke="#12191a"/><text x="48" y="58" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="16" fill="#8ee1c5">01 / 實作內容</text><text x="48" y="105" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="30" fill="#e5eeea">企業 AI Agent：把自然語言問題接上實際資料</text><text x="48" y="137" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="17" fill="#a9b9b2">由我獨立完成架構、MCP 工具、資料整合、應用與部署。下列查詢為示意。</text><rect x="48" y="168" width="524" height="264" rx="12" fill="#1c2627" stroke="#344746"/><rect x="596" y="168" width="556" height="264" rx="12" fill="#1c2627" stroke="#344746"/><text x="72" y="207" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="22" fill="#e5eeea">使用者問題與 SQL 查詢</text><text x="72" y="251" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="20" fill="#8ee1c5">「各機台今天有多少筆量測紀錄？」</text><text x="72" y="296" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#a9b9b2">SELECT equipment_id, COUNT(*)</text><text x="72" y="324" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#a9b9b2">FROM measurements</text><text x="72" y="352" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#a9b9b2">WHERE measured_at &gt;= :today</text><text x="72" y="380" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#a9b9b2">GROUP BY equipment_id;</text><text x="620" y="207" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="22" fill="#e5eeea">MCP 資料庫工具</text><text x="620" y="247" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="20" fill="#8ee1c5">提供受控操作，取得真實查詢結果</text><text x="620" y="294" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#e5eeea">機台</text><text x="855" y="294" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#e5eeea">量測筆數</text><path d="M620 308 L1120 308" stroke="#344746" fill="none"/><text x="620" y="330" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">EQ-A</text><text x="855" y="330" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">120</text><path d="M620 341 L1120 341" stroke="#344746" fill="none"/><text x="620" y="363" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">EQ-B</text><text x="855" y="363" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">86</text><path d="M620 374 L1120 374" stroke="#344746" fill="none"/><text x="620" y="396" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">EQ-C</text><text x="855" y="396" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">104</text><path d="M48 466 L1152 466" stroke="#344746" fill="none"/><text x="48" y="510" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="16" fill="#8ee1c5">02 / 上線與使用成果</text><text x="48" y="581" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="37" fill="#8ee1c5">約 80 人次／日</text><text x="48" y="625" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="21" fill="#e5eeea">每日使用人次直接統計</text><text x="48" y="663" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="17" fill="#a9b9b2">已進入工程師日常工作</text><text x="650" y="581" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="37" fill="#8ee1c5">獨立完成</text><text x="650" y="625" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="21" fill="#e5eeea">架構、整合、實作與上線</text><text x="650" y="663" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="17" fill="#a9b9b2">工具查詢資料，模型整理回覆</text></svg>