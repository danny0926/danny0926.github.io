<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img"><title>STDF 缺失值處理與交付成果</title><rect x="0" y="0" width="1200" height="760" rx="22" fill="#12191a" stroke="#12191a"/><text x="48" y="58" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="16" fill="#8ee1c5">01 / 實作內容</text><text x="48" y="105" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="30" fill="#e5eeea">STDF：不只轉出數值，也保留量測資料的意義</text><text x="48" y="137" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="17" fill="#a9b9b2">客製化 Python 開源轉檔系統，完整提取公司使用欄位，再以 Cython 加速。</text><rect x="48" y="168" width="1104" height="264" rx="12" fill="#1c2627" stroke="#344746"/><text x="72" y="208" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="22" fill="#e5eeea">新舊系統交叉比對：缺失值與量測旗標</text><text x="72" y="251" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#8ee1c5">情況</text><text x="325" y="251" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#8ee1c5">量測值</text><text x="513" y="251" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#8ee1c5">其他欄位／旗標</text><text x="844" y="251" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#8ee1c5">轉檔後判讀</text><path d="M72 275 L1125 275" stroke="#344746" fill="none"/><text x="72" y="300" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">一般量測</text><text x="325" y="300" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">有數值</text><text x="513" y="300" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">量測有效</text><text x="844" y="300" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">保留量測結果</text><path d="M72 324 L1125 324" stroke="#344746" fill="none"/><text x="72" y="349" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">真正缺失</text><text x="325" y="349" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">未提供</text><text x="513" y="349" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">欄位與旗標共同確認</text><text x="844" y="349" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">標記缺失</text><path d="M72 373 L1125 373" stroke="#344746" fill="none"/><text x="72" y="398" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">量測異常</text><text x="325" y="398" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">不可直接採用</text><text x="513" y="398" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">存在故障／異常紀錄</text><text x="844" y="398" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">保留異常意義</text><path d="M48 466 L1152 466" stroke="#344746" fill="none"/><text x="48" y="510" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="16" fill="#8ee1c5">02 / 交付與系統替代</text><text x="48" y="581" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="37" fill="#8ee1c5">Cython</text><text x="48" y="625" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="21" fill="#e5eeea">加速大量資料處理</text><text x="48" y="663" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="17" fill="#a9b9b2">客製欄位，核對新舊輸出</text><text x="435" y="581" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="37" fill="#8ee1c5">6 個月</text><text x="435" y="625" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="21" fill="#e5eeea">上線後未需修改或進版</text><text x="435" y="663" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="17" fill="#a9b9b2">穩定接手既有轉檔工作</text><text x="819" y="581" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="37" fill="#8ee1c5">約 600 萬／年</text><text x="819" y="625" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="21" fill="#e5eeea">原系統維運成本</text><text x="819" y="663" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="17" fill="#a9b9b2">提出替代方案的成本背景</text></svg>