<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img"><title>TTT-Discover 單卡實作與量測結果</title><rect x="0" y="0" width="1200" height="760" rx="22" fill="#12191a" stroke="#12191a"/><text x="48" y="58" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="16" fill="#8ee1c5">01 / 實作內容</text><text x="48" y="105" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="30" fill="#e5eeea">TTT-Discover：在單卡上完成 Alpha 挖掘實驗</text><text x="48" y="137" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="17" fill="#a9b9b2">共用模型權重進行本地產碼與 LoRA 更新，以驗證結果判斷候選因子。</text><rect x="48" y="168" width="524" height="264" rx="12" fill="#1c2627" stroke="#344746"/><rect x="596" y="168" width="556" height="264" rx="12" fill="#1c2627" stroke="#344746"/><text x="72" y="209" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="22" fill="#e5eeea">生成與更新，共享一份 base 權重</text><rect x="79" y="240" width="459" height="65" rx="12" fill="#314d45" stroke="#81bca8"/><text x="109" y="281" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="24" fill="#e5eeea">Qwen2.5-Coder-7B + LoRA</text><text x="79" y="346" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">產碼：本地 Coder 生成 Alpha 程式</text><text x="79" y="388" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="19" fill="#e5eeea">更新：開啟 train step，進行 40 輪實驗</text><text x="620" y="209" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="22" fill="#e5eeea">候選 Alpha 的驗證重點</text><text x="620" y="260" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#8ee1c5">程式檢查</text><text x="784" y="260" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#e5eeea">能執行，且輸出形式有效</text><text x="620" y="323" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#8ee1c5">退化解檢查</text><text x="784" y="323" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#e5eeea">排除恆等於 1 等假因子</text><text x="620" y="386" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#8ee1c5">walk-forward</text><text x="784" y="386" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#e5eeea">以樣本外 Sharpe 重新排名</text><path d="M48 466 L1152 466" stroke="#344746" fill="none"/><text x="48" y="510" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="16" fill="#8ee1c5">02 / 記憶體與固定 16 個 idea 的批次實驗</text><text x="48" y="555" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="21" fill="#e5eeea">共享權重 / 4-bit</text><text x="48" y="611" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#e5eeea">兩份模型</text><rect x="155" y="589" width="209.3725" height="26" rx="3" fill="#7fc8ad" stroke="none"/><text x="438" y="611" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#e5eeea">18.82 GiB</text><text x="48" y="669" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#e5eeea">共享模型</text><rect x="155" y="647" width="151.63375000000002" height="26" rx="3" fill="#7fc8ad" stroke="none"/><text x="438" y="669" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#e5eeea">13.63 GiB</text><text x="650" y="555" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="21" fill="#e5eeea">產碼、驗證與評分完成時間</text><text x="650" y="611" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#e5eeea">併發 1</text><rect x="757" y="589" width="234.48533333333333" height="26" rx="3" fill="#7fc8ad" stroke="none"/><text x="1040" y="611" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#e5eeea">39.52 秒</text><text x="650" y="669" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#e5eeea">併發 16</text><rect x="757" y="647" width="31.684" height="26" rx="3" fill="#7fc8ad" stroke="none"/><text x="1040" y="669" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#e5eeea">5.34 秒</text><text x="48" y="724" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#8ee1c5">節省 5.19 GiB 的 PyTorch allocated 峰值</text><text x="650" y="724" font-family="Microsoft JhengHei,Arial,sans-serif" font-size="18" fill="#8ee1c5">完成時間中位數：加速約 7.4 倍</text></svg>